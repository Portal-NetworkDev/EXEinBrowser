<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebEXE Runner</title>
    <link rel="stylesheet" href="boxedwine/boxedwine.css">
</head>
<body>
    <div id="loading">
        <figure id="spinner" style="overflow:visible">
            <div class="spinner"></div>
        </figure>

        <div id="status">Loading WebEXE...</div>
        <progress id="progress" value="0" max="100"></progress>
    </div>

    <div id="app">
        <div id="controls">
            <button id="startbtn" style="display:none" onclick="start()">Start</button>
            <button id="uploadbtn" style="display:none" onclick="document.getElementById('upload').click()">Add File(s)</button>
            <input id="upload" name="upload" type="file" multiple style="display:none" onchange="startWithFiles(event.target.files)">
            <button id="downloadbtn" style="display:none">Get File(s)</button>

            <input type="checkbox" id="pointerLock">Lock/hide mouse pointer
            <input type="checkbox" id="showConsole" onclick="toggleConsole()" checked>Show console

            <div id="sound-checkbox" style="display:none">
                <input type="checkbox" id="soundToggle">Sound
            </div>
        </div>

        <div id="dropzone">
            <div class="emscripten_border">
                <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>
        </div>

        <div id="console">
            <textarea class="emscripten" id="output" rows="8" style="display:none"></textarea>
        </div>
    </div>

    <script src="boxedwine/browserfs.boxedwine.js"></script>
    <script src="boxedwine/jszip.min.js"></script>
    <script src="boxedwine/boxedwine-shell.js"></script>
    <script src="boxedwine/boxedwine.js"></script>
    <script src="runner.js"></script>
</body>
</html>
